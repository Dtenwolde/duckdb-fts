<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640">
<rect width="100%" height="100%" fill="white"/>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #52606d; }
.axis { font-size: 12px; fill: #52606d; }
.label { font-size: 13px; }
.small { font-size: 11px; fill: #52606d; }
.value { font-size: 12px; font-weight: 600; }
.barlabel { font-size: 11px; fill: white; font-weight: 600; }
</style>
<text class="title" x="40" y="42">Generated Tenant Update Latency</text>
<text class="subtitle" x="40" y="66">Median update freshness cost; x-axis is logarithmic seconds</text>
